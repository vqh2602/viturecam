name: Release — Auto Version, Tag & macOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Bump Version → Tag → Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read current version
        id: current
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          SEMVER=$(echo "$RAW" | cut -d'+' -f1)
          BUILD=$(echo "$RAW" | cut -d'+' -f2)
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "build=$BUILD"   >> $GITHUB_OUTPUT
          echo "Current version: $SEMVER (build $BUILD)"

      - name: Compute next version
        id: next
        run: |
          SEMVER="${{ steps.current.outputs.semver }}"
          BUILD="${{ steps.current.outputs.build }}"
          MAJOR=$(echo "$SEMVER" | cut -d. -f1)
          MINOR=$(echo "$SEMVER" | cut -d. -f2)
          PATCH=$(echo "$SEMVER" | cut -d. -f3)

          BUMP="${{ github.event.inputs.bump }}"
          if [ -z "$BUMP" ]; then BUMP="patch"; fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH+1)) ;;
          esac

          NEW_BUILD=$((BUILD+1))
          NEW_SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_FULL="${NEW_SEMVER}+${NEW_BUILD}"

          echo "semver=$NEW_SEMVER"  >> $GITHUB_OUTPUT
          echo "build=$NEW_BUILD"    >> $GITHUB_OUTPUT
          echo "full=$NEW_FULL"      >> $GITHUB_OUTPUT
          echo "tag=v${NEW_SEMVER}"  >> $GITHUB_OUTPUT
          echo "Next version: $NEW_FULL  (tag: v$NEW_SEMVER)"

      - name: Bump version in pubspec.yaml
        run: |
          NEW="${{ steps.next.outputs.full }}"
          sed -i '' "s/^version: .*/version: $NEW/" pubspec.yaml
          echo "Updated pubspec.yaml to: $NEW"

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.next.outputs.full }} [skip ci]"
          git push origin main

      - name: Create and push tag
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"

      # ── Code Signing ───────────────────────────────────────────────────────
      # Cấu hình 3 secrets trong: repo Settings → Secrets and variables → Actions
      #   MACOS_CERTIFICATE     — base64 của file .p12 (export từ Keychain Access)
      #   MACOS_CERTIFICATE_PWD — mật khẩu .p12
      #   KEYCHAIN_PASSWORD     — mật khẩu tự đặt cho keychain tạm
      #
      # Khi secrets chưa cấu hình: inject override vào xcconfig để
      # tắt code signing → build vẫn thành công (ad-hoc, không submit App Store)
      - name: Import code signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "⚠️  MACOS_CERTIFICATE not set — skipping certificate import."
            exit 0
          fi

          echo "🔐 Importing Apple certificate..."
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          if security import /tmp/cert.p12 \
              -k build.keychain \
              -P "$MACOS_CERTIFICATE_PWD" \
              -T /usr/bin/codesign \
              -T /usr/bin/productbuild; then
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" build.keychain
            security list-keychains -d user -s build.keychain login.keychain
            echo "✅ Certificate imported successfully."
          else
            echo "⚠️  Certificate import failed — proceeding without signing."
          fi

      # Khi không có cert: inject CODE_SIGNING_ALLOWED=NO vào Flutter-Release.xcconfig
      # Xcconfig này được include bởi Release.xcconfig → áp dụng cho toàn bộ targets
      - name: Disable code signing (when no certificate)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "✅ Certificate configured — keeping project signing settings."
            exit 0
          fi

          echo "🔧 Injecting signing overrides into Flutter-Release.xcconfig..."
          cat >> macos/Flutter/Flutter-Release.xcconfig << 'XCCONFIG_EOF'

          // CI override — disable code signing when no certificate is provided
          CODE_SIGN_IDENTITY=
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          CODE_SIGN_STYLE=Manual
          XCCONFIG_EOF

          echo "✅ Signing disabled via xcconfig override."
          echo "--- Flutter-Release.xcconfig ---"
          cat macos/Flutter/Flutter-Release.xcconfig

      - name: Build macOS app
        run: |
          flutter build macos --release \
            --build-name="${{ steps.next.outputs.semver }}" \
            --build-number="${{ steps.next.outputs.build }}"

      - name: Package into DMG
        id: dmg
        run: |
          APP_PATH="build/macos/Build/Products/Release/Beauty Camera.app"
          DMG_NAME="BeautyCamera-${{ steps.next.outputs.semver }}.dmg"

          if [ ! -d "$APP_PATH" ]; then
            echo "⚠️  App not found at expected path, searching..."
            find build/macos -name "*.app" -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          echo "📦 Creating DMG: $DMG_NAME"

          if ! command -v create-dmg &>/dev/null; then
            brew install create-dmg --quiet
          fi

          # create-dmg exit code 2 = success but codesign warning — treat as OK
          set +e
          create-dmg \
            --volname "Beauty Camera ${{ steps.next.outputs.semver }}" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "Beauty Camera.app" 200 190 \
            --hide-extension "Beauty Camera.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" "$APP_PATH"
          CDG_EXIT=$?
          set -e

          if [ "$CDG_EXIT" -eq 0 ] || [ "$CDG_EXIT" -eq 2 ]; then
            echo "✅ DMG created with create-dmg (exit $CDG_EXIT)."
          else
            echo "⚠️  create-dmg failed (exit $CDG_EXIT), falling back to hdiutil..."
            hdiutil create -volname "Beauty Camera" \
              -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
            echo "✅ DMG created with hdiutil."
          fi

          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next.outputs.tag }}
          name: "Beauty Camera ${{ steps.next.outputs.semver }}"
          body: |
            ## 🚀 Beauty Camera ${{ steps.next.outputs.semver }}

            **Build:** `${{ steps.next.outputs.full }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ### Cài đặt
            1. Tải file `.dmg` bên dưới
            2. Kéo **Beauty Camera.app** vào thư mục **Applications**
            3. Mở app — cấp quyền Camera khi được hỏi
          files: ${{ steps.dmg.outputs.dmg_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f /tmp/cert.p12
